<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Sweet Memories</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
    :root{
        --wine:#6e1530;
        --rose-deep:#b81656;
        --rose-mid:#e08aa6;
        --blush:#fff1f4;
        --champagne:#d9b479;
        --champagne-dark:#b3903f;
        --cream:#fffaf6;
        --plum:#3d2233;
        --card-bg:#fffdfb;
    }
    *{box-sizing:border-box;}
    body {
        font-family: 'Poppins', sans-serif;
        background: var(--blush);
        margin: 0;
        padding: 0;
        color: var(--plum);
        overflow-x: hidden;
        position: relative;
    }

    #heartLayer, #sparkleLayer{
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
    }
    .floating-heart{
        position: absolute;
        bottom: -40px;
        color: var(--rose-mid);
        opacity: 0.5;
        animation: floatUp linear forwards;
    }
    @keyframes floatUp{
        0%   { transform: translateY(0) scale(0.8); opacity: 0; }
        10%  { opacity: 0.55; }
        90%  { opacity: 0.3; }
        100% { transform: translateY(-112vh) rotate(20deg) scale(1); opacity: 0; }
    }
    .sparkle{
        position:absolute;
        width:4px; height:4px;
        background: var(--champagne);
        border-radius:50%;
        opacity:0;
        animation: twinkle ease-in-out infinite;
    }
    @keyframes twinkle{
        0%,100%{ opacity:0; transform:scale(0.5); }
        50%{ opacity:0.85; transform:scale(1.3); }
    }

    header {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 60px 20px 40px;
        background: radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.25), transparent 60%),
                    linear-gradient(160deg, var(--rose-mid), var(--wine));
        box-shadow: 0 6px 22px rgba(110,21,48,0.25);
    }
    h1 {
        font-family: 'Dancing Script', cursive;
        font-size: clamp(2.8rem, 7vw, 4.4rem);
        margin: 0;
        color: #fff;
        text-shadow: 0 2px 18px rgba(255,255,255,0.35);
    }
    .ornament{ width: 120px; margin: 16px auto; opacity: 0.9; }
    .ornament path, .ornament line{ stroke: var(--champagne); fill: none; }
    #quote {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 1.2rem;
        color: #fff0f4;
        min-height: 1.6em;
        max-width: 480px;
        margin: 0 auto;
        transition: opacity 0.6s ease;
    }

    #counterWrap{
        margin: 22px auto 0;
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        background: rgba(255,255,255,0.14);
        border: 1px solid rgba(255,255,255,0.35);
        padding: 8px 22px;
        border-radius: 30px;
        cursor: pointer;
        transition: transform 0.2s ease;
    }
    #counterWrap:hover{ transform: scale(1.04); background: rgba(255,255,255,0.22); }
    #counterNumber{
        font-family: 'Dancing Script', cursive;
        font-size: 1.8rem;
        color: var(--champagne);
        font-weight: 700;
    }
    #counterLabel{ font-size: 0.85rem; color: #fff0f4; }

    .btn-upload {
        background: linear-gradient(135deg, var(--champagne), var(--champagne-dark));
        color: #3d2233;
        border: none;
        padding: 13px 30px;
        font-size: 0.95rem;
        font-weight: 500;
        border-radius: 25px;
        cursor: pointer;
        margin-top: 26px;
        font-family: 'Poppins', sans-serif;
        box-shadow: 0 5px 14px rgba(0,0,0,0.2);
        transition: transform 0.2s ease;
    }
    .btn-upload:hover { transform: translateY(-2px); }
    .btn-upload:disabled { opacity: 0.6; cursor: not-allowed; }

    .form-container {
        position: relative;
        z-index: 2;
        background: var(--card-bg);
        max-width: 480px;
        margin: 30px auto;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 12px 26px rgba(184,22,86,0.14);
        border: 1px solid #f6d5de;
        display: none;
    }
    .form-container h2{
        font-family: 'Dancing Script', cursive;
        color: var(--rose-deep);
        text-align:center;
        margin-top:0;
        font-size: 1.9rem;
    }
    .form-container label{ display:block; font-size: 0.85rem; margin-top: 12px; }
    .form-container input, .form-container textarea {
        width: 100%;
        padding: 10px;
        margin: 6px 0;
        border: 1px solid #f0c3d0;
        border-radius: 8px;
        font-family: 'Poppins', sans-serif;
    }

    .gallery {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 34px 26px;
        padding: 50px 30px;
        max-width: 1200px;
        margin: 0 auto;
    }
    .card {
        background: var(--card-bg);
        padding: 14px 14px 20px;
        border-radius: 4px;
        box-shadow: 0 10px 20px rgba(110,21,48,0.14);
        text-align: center;
        border: 1px solid #f9e3ea;
        position: relative;
        transform: rotate(var(--tilt, -1.5deg));
        transition: transform 0.3s ease;
    }
    .card:hover { transform: rotate(0deg) translateY(-6px) scale(1.02); z-index: 3; }
    .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 2px;
        cursor: zoom-in;
    }
    .card p {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 1.25rem;
        margin: 14px 4px 2px;
        color: var(--rose-deep);
    }
    .card-date {
        display: block;
        font-size: 0.72rem;
        color: var(--champagne-dark);
        margin-top: 4px;
    }
    .pin{ position:absolute; top:-10px; left:50%; transform: translateX(-50%); font-size: 20px; }
    .empty-state{ grid-column: 1 / -1; text-align:center; font-style: italic; color: var(--rose-deep); padding: 40px; }
    .btn-delete {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(110,21,48,0.85);
        color: white;
        border: none;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        cursor: pointer;
    }

    #lightbox{
        position: fixed;
        inset: 0;
        background: rgba(61,34,51,0.94);
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        cursor: zoom-out;
    }
    #lightbox.show{ display:flex; }
    #lightbox img{ max-width: 92vw; max-height: 80vh; border-radius: 6px; }
    #lightboxCaption{
        position:absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff0f4;
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 1.25rem;
    }

    #musicControl {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 5;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--rose-mid), var(--wine));
        color: #fff;
        border: none;
        cursor: pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size: 22px;
        box-shadow: 0 6px 16px rgba(110,21,48,0.4);
    }
    #musicControl.spinning .note{ display:inline-block; animation: spin 4s linear infinite; }
    @keyframes spin { from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }

    footer{ text-align:center; padding: 24px; font-style: italic; color: var(--rose-deep); }
</style>
</head>
<body>

<div id="heartLayer"></div>
<div id="sparkleLayer"></div>

<header>
    <h1>Our Sweet Memories</h1>
    <svg class="ornament" viewBox="0 0 120 20">
        <line x1="0" y1="10" x2="42" y2="10" stroke-width="1"></line>
        <path d="M60 16 C 54 8, 46 8, 46 14 C 46 19, 60 22, 60 22 C 60 22, 74 19, 74 14 C 74 8, 66 8, 60 16 Z" stroke-width="1"></path>
        <line x1="78" y1="10" x2="120" y2="10" stroke-width="1"></line>
    </svg>
    <p id="quote"></p>

    <!-- Hitung hari manual -->
    <div id="counterWrap" title="Ketuk untuk mengatur jumlah hari bersama">
        <span id="counterNumber">—</span>
        <span id="counterLabel">hari bersama</span>
    </div>
    <br>
    <button class="btn-upload" onclick="toggleForm()">+ Tambah Kenangan</button>
</header>

<!-- Form Upload -->
<div id="formContainer" class="form-container">
    <h2>Unggah Momen Baru</h2>
    <form id="uploadForm">
        <label for="fileInput">Pilih Foto</label>
        <input type="file" id="fileInput" accept="image/*" required>

        <label for="dateInput">Tanggal Momen</label>
        <input type="date" id="dateInput" required>

        <label for="captionInput">Pesan Singkat</label>
        <textarea id="captionInput" rows="3" placeholder="Tulis kenangan manis..." required></textarea>

        <button type="submit" id="btnSubmit" class="btn-upload" style="width: 100%;">Simpan Kenangan</button>
    </form>
    <label for="musicInput" style="margin-top:18px;">Ganti Lagu Latar (MP3)</label>
    <input type="file" id="musicInput" accept="audio/*">
</div>

<div id="gallery" class="gallery"></div>
<footer>dibuat dengan sepenuh hati ❤</footer>

<!-- Lightbox -->
<div id="lightbox">
    <div id="lightboxContent"></div>
    <div id="lightboxCaption"></div>
</div>

<button id="musicControl" title="Musik"><span class="note">♪</span></button>
<audio id="bgAudio" loop></audio>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATBUbaGvJL3OLgd9H66CQzfrXIuOavCFg",
  authDomain: "album-32d5e.firebaseapp.com",
  projectId: "album-32d5e",
  messagingSenderId: "355177526186",
  appId: "1:355177526186:web:bbce581257f9002fe6f1d3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// KOMPRESI GAMBAR RAMAH HP (Menggunakan Hardware Decoder Bawaan HP)
async function compressImage(file) {
    // 1. Prioritaskan createImageBitmap (sangat cepat & hemat RAM di HP Android)
    if ('createImageBitmap' in window) {
        try {
            const bmp = await createImageBitmap(file);
            let width = bmp.width;
            let height = bmp.height;
            const maxDim = 800; // Ukuran optimal untuk Firestore

            if (width > height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
            } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bmp, 0, 0, width, height);
            bmp.close();
            return canvas.toDataURL('image/jpeg', 0.65);
        } catch (e) {
            console.warn("createImageBitmap gagal, beralih ke ObjectURL:", e);
        }
    }

    // 2. Cadangan: Menggunakan ObjectURL
    return new Promise((resolve, reject) => {
        const img = new Image();
        const objUrl = URL.createObjectURL(file);

        img.onload = () => {
            URL.revokeObjectURL(objUrl);
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 800;

            if (width > height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
            } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
        };

        img.onerror = () => {
            URL.revokeObjectURL(objUrl);
            // 3. Cadangan Terakhir: FileReader biasa
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = () => reject(new Error("File foto tidak bisa dibaca oleh browser."));
            reader.readAsDataURL(file);
        };

        img.src = objUrl;
    });
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Gagal membaca file lagu."));
    });
}

/* ================= CRUD Firestore ================= */

async function addMemory(caption, date, photoDataURL) {
    await db.collection('memories').add({
        caption: caption,
        date: date,
        fileURL: photoDataURL,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
}

async function getAllMemories() {
    const snap = await db.collection('memories').get();
    let data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    data.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
    return data;
}

async function deleteMemoryById(id) {
    await db.collection('memories').doc(id).delete();
}

async function saveSetting(key, val) {
    await db.collection('settings').doc(key).set({ value: val });
}

async function getSetting(key) {
    const doc = await db.collection('settings').doc(key).get();
    return doc.exists ? doc.data().value : null;
}

function formatTanggalIndonesia(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

/* ================= Form & Galeri ================= */
const gallery = document.getElementById('gallery');
const form = document.getElementById('uploadForm');
const fileInput = document.getElementById('fileInput');
const dateInput = document.getElementById('dateInput');
const captionInput = document.getElementById('captionInput');
const btnSubmit = document.getElementById('btnSubmit');

function toggleForm() {
    const el = document.getElementById('formContainer');
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

const tilts = [-2.2, -1.2, -0.4, 0.6, 1.4, 2.1];

async function renderGallery() {
    gallery.innerHTML = "<p class='empty-state'>Memuat kenangan...</p>";
    try {
        const memories = await getAllMemories();
        gallery.innerHTML = '';

        if (!memories || memories.length === 0) {
            gallery.innerHTML = "<p class='empty-state'>Belum ada kenangan. Yuk, unggah yang pertama...</p>";
            return;
        }

        memories.reverse().forEach((mem, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.setProperty('--tilt', tilts[i % tilts.length] + 'deg');

            card.innerHTML = `
                <span class="pin">📌</span>
                <button class="btn-delete" title="Hapus">×</button>
                <img src="${mem.fileURL}" alt="Kenangan" loading="lazy">
                <p>${escapeHtml(mem.caption || '')}</p>
                <span class="card-date">${formatTanggalIndonesia(mem.date)}</span>
            `;

            card.querySelector('.btn-delete').addEventListener('click', (e) => {
                e.stopPropagation();
                onDelete(mem.id);
            });

            card.querySelector('img').addEventListener('click', () => {
                openLightbox(mem.fileURL, mem.caption);
            });

            gallery.appendChild(card);
        });
    } catch (e) {
        console.error(e);
        gallery.innerHTML = "<p class='empty-state'>Periksa tab Rules Firestore Anda. Pastikan allow read, write: if true;</p>";
    }
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

async function onDelete(id) {
    if (confirm('Hapus kenangan ini?')) {
        await deleteMemoryById(id);
        renderGallery();
    }
}

form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const file = fileInput.files[0];
    if (!file) return;

    btnSubmit.disabled = true;
    btnSubmit.textContent = "Mengompres & Menyimpan...";

    try {
        const compressedBase64 = await compressImage(file);
        const tgl = dateInput.value || new Date().toISOString().slice(0, 10);
        await addMemory(captionInput.value, tgl, compressedBase64);

        form.reset();
        toggleForm();
        renderGallery();
        burstHearts();
    } catch (err) {
        // Penanganan error dengan teks jelas jika terjadi masalah
        const pesanEror = err?.message || err?.code || String(err);
        alert("Gagal menyimpan: " + pesanEror);
        console.error("Detail Error:", err);
    } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Simpan Kenangan";
    }
});

/* ================= Lightbox ================= */
const lightbox = document.getElementById('lightbox');
const lightboxContent = document.getElementById('lightboxContent');
const lightboxCaption = document.getElementById('lightboxCaption');

function openLightbox(url, caption) {
    lightboxContent.innerHTML = `<img src="${url}">`;
    lightboxCaption.textContent = caption || '';
    lightbox.classList.add('show');
}
lightbox.addEventListener('click', () => lightbox.classList.remove('show'));

/* ================= Musik ================= */
const bgAudio = document.getElementById('bgAudio');
const musicControl = document.getElementById('musicControl');
const musicInput = document.getElementById('musicInput');

async function loadMusic() {
    try {
        const music = await getSetting('bgMusic');
        if (music) {
            bgAudio.src = music;
            bgAudio.play().then(() => musicControl.classList.add('spinning')).catch(() => {});
        }
    } catch (e) {}
}

musicControl.addEventListener('click', () => {
    if (!bgAudio.src) { musicInput.click(); return; }
    if (bgAudio.paused) {
        bgAudio.play();
        musicControl.classList.add('spinning');
    } else {
        bgAudio.pause();
        musicControl.classList.remove('spinning');
    }
});

musicInput.addEventListener('change', async () => {
    const file = musicInput.files[0];
    if (!file) return;
    if (file.size > 1024 * 1024) {
        alert("File musik terlalu besar! Gunakan file MP3 di bawah 1MB.");
        return;
    }
    try {
        const b64 = await fileToBase64(file);
        await saveSetting('bgMusic', b64);
        bgAudio.src = b64;
        bgAudio.play();
        musicControl.classList.add('spinning');
    } catch (e) {
        alert("Gagal memutar musik: " + e.message);
    }
});

/* ================= Hitungan Hari Manual ================= */
const counterWrap = document.getElementById('counterWrap');
const counterNumber = document.getElementById('counterNumber');

async function loadCounter() {
    try {
        const val = await getSetting('manualDays');
        counterNumber.textContent = val || '100';
    } catch (e) {
        counterNumber.textContent = '100';
    }
}

counterWrap.addEventListener('click', async () => {
    const current = counterNumber.textContent;
    const input = prompt('Masukkan jumlah hari bersama secara manual:', current);
    if (input !== null && input.trim() !== '') {
        counterNumber.textContent = input.trim();
        await saveSetting('manualDays', input.trim());
    }
});

/* ================= Animasi & Hiasan ================= */
const quotes = [
    'Di setiap detik bersamamu, waktu terasa berjalan lebih lembut.',
    'Kenangan kecil ini, kusimpan sebagai harta yang paling berharga.',
    'Bersamamu, hal paling sederhana pun terasa seperti cerita indah.'
];
let qIndex = 0;
function cycleQuote() {
    const el = document.getElementById('quote');
    el.style.opacity = 0;
    setTimeout(() => {
        el.textContent = quotes[qIndex % quotes.length];
        qIndex++;
        el.style.opacity = 1;
    }, 450);
}

const heartLayer = document.getElementById('heartLayer');
function spawnHeart() {
    if (heartLayer.children.length > 20) return;
    const h = document.createElement('div');
    h.className = 'floating-heart';
    h.textContent = '❤';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (12 + Math.random() * 16) + 'px';
    h.style.animationDuration = (8 + Math.random() * 5) + 's';
    heartLayer.appendChild(h);
    setTimeout(() => h.remove(), 12000);
}

function burstHearts() {
    for (let i = 0; i < 15; i++) {
        setTimeout(() => {
            const h = document.createElement('div');
            h.className = 'floating-heart';
            h.textContent = '❤';
            h.style.left = (40 + Math.random() * 20) + 'vw';
            h.style.bottom = '10vh';
            h.style.fontSize = (16 + Math.random() * 16) + 'px';
            heartLayer.appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }, i * 50);
    }
}

cycleQuote();
setInterval(cycleQuote, 5500);
setInterval(spawnHeart, 1500);
document.getElementById('dateInput').value = new Date().toISOString().slice(0, 10);
loadCounter();
loadMusic();
renderGallery();
</script>

</body>
</html>
